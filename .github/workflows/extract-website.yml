name: Extract Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          unzip -o enochs-home-cleanup-fresh-website.zip -d extracted

          cp -R extracted/app .
          cp extracted/package.json .
          cp extracted/tsconfig.json .
          cp extracted/next-env.d.ts .
          cp extracted/next.config.ts .
          cp extracted/README.md .

          rm -rf extracted
          rm -f enochs-home-cleanup-fresh-website.zip

      - name: Save extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract ENOCHs HOME CLEANUP website" || echo "Nothing to commit"
          git push
